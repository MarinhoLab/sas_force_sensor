services:
  sas_force_sensor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - DISPLAY
      - ROS_DOMAIN_ID
    volumes:
      - ~/.Xauthority:/root/.Xauthority
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: /bin/bash -c "
      cd /root/sas_force_sensor_devel/src/
      && ls .
      && colcon build
      && source install/setup.bash
      && colcon test
      && colcon test-result
      && [ -e /usr/lib/$(gcc -dumpmachine)/libasan.so.8 ] && [ -e /usr/lib/$(gcc -dumpmachine)/libubsan.so.1 ] || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasan8 libubsan1; }
      && colcon build --build-base build_san --install-base install_san --cmake-args -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      && source install_san/setup.bash
      && ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 colcon test --build-base build_san
      && colcon test-result --test-result-base build_san --verbose | grep -E "Summary[:][ ][1-9][0-9]* tests, 0 errors, 0 failures"
      && ros2 run sas_force_sensor sas_force_sensor_interface_example.py"

  sas_force_sensor_gui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - DISPLAY
      - ROS_DOMAIN_ID
    volumes:
      - ~/.Xauthority:/root/.Xauthority
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: /bin/bash -c "
      sudo apt-get install -y xvfb
      && (sudo /usr/bin/Xvfb :99 -screen 0 1280x1024x24 &)
      && export DISPLAY=:99
      && cd /root/sas_force_sensor_devel/src/
      && ls .
      && colcon build
      && source install/setup.bash
      && ros2 run sas_force_sensor sas_force_sensor_gui"
