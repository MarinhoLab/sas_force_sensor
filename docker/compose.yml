services:
  sas_force_sensor:
    build: .
    volumes:
      - ../../sas_force_sensor:/root/sas_force_sensor_devel/src/sas_force_sensor
    command: /bin/bash -c "
      cd /root/sas_force_sensor_devel/src/
      && ls .
      && colcon build
      && source install/setup.bash
      && ros2 run sas_force_sensor sas_force_sensor_interface_example.py"
